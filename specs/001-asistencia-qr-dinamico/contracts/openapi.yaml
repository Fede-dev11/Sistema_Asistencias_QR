    AttendanceRow:
      type: object
      additionalProperties: false
      properties:
        asistencia_id:
          type: string
          format: uuid
          nullable: true
          description: UUID si existe asistencia confirmada; null para pendiente o rechazo sin asistencia.
        persona_id:
          type: string
          format: uuid
