openapi: 3.0.3
info:
  title: UNL GeoAsist — contrato de planificación condicionado
  version: 0.2.0-draft
  description: 'BORRADOR: diseño técnico condicionado a la revisión de la excepción constitucional para invitados
    identificados solo por cédula contra listado. No declara superado el Constitution Check ni autoriza implementar.
    YAML fuente de verdad. Backend común para web y móvil. Todas las reglas y ámbitos se verifican en servidor.
    HTTPS fuera del entorno local; respuestas con datos personales o secretos usan Cache-Control: no-store. No hay
    endpoint público para consultar si una cédula tiene cuenta o pertenece al listado. La cédula y el QR no prueban
    titularidad ni presencia física. RESPONSABLE expresa la relación de responsabilidad con una actividad verificada
    en servidor y el rol DOCENTE o ENCARGADO; no es un rol global suficiente. Retención: recurso nominal vencido
    aún reconocible devuelve 410; tras sanear o eliminar sus encabezados, 404. Ambos impiden acceso nominal; no
    conservar datos personales, responsable o carrera únicamente para seguir devolviendo 410.'
servers:
- url: /api/v1
  description: Mismo origen por defecto; configurar URL HTTPS del backend común en cada entorno.
security:
- SessionBearer: []
tags:
- name: auth
- name: activities
- name: sessions
- name: attendance
- name: guest-registrations
- name: attempts
paths:
  /auth/login:
    post:
      operationId: login
      summary: Iniciar sesión con credenciales
      description: Proveedor local semilla solo en desarrollo; CAS detrás del proveedor de identidad queda pendiente
        de confirmación institucional. Bearer opaco revocable respaldado en PostgreSQL; sin JWT ni almacenamiento
        web persistente.
      tags:
      - auth
      responses:
        '200':
          description: Sesión autenticada creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              example:
                access_token: ejemplo-opaco-no-es-una-credencial-real-0001
                token_type: Bearer
                vence_en: '2026-10-19T17:00:00Z'
                roles:
                - ESTUDIANTE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: logout
      summary: Revocar sesión autenticada
      description: Revoca en PostgreSQL el bearer presentado. No registrar su valor.
      tags:
      - auth
      responses:
        '204':
          description: Sesión revocada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /activities:
    get:
      operationId: listActivities
      summary: Descubrir actividades autorizadas
      description: Lista paginada y filtrada en servidor. RESPONSABLE solo descubre sus actividades; DIRECTOR_INSTITUCIONAL
        todas; DIRECTOR_CARRERA solo las vinculadas a su carrera y paralelos. Los filtros restringen el ámbito autorizado
        y nunca lo amplían. Una carrera fuera del ámbito devuelve 403. Excluir actividades cuyo plazo nominal de
        cinco años calendario ya venció; los agregados anónimos no se exponen aquí. Sin filtros, devolver solo actividades
        autorizadas.
      tags:
      - activities
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: modalidad
        in: query
        description: Restringir por tipo de actividad dentro del ámbito autorizado.
        schema:
          type: string
          enum:
          - CLASE
          - EVENTO
      - name: carrera_id
        in: query
        description: Restringir por vínculo de carrera verificado en servidor; no concede permisos.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Página de actividades visibles, incluso vacía; sin datos de otros ámbitos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
              example:
                items: []
                page: 0
                size: 20
                total: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /activities/{activityId}:
    get:
      operationId: getActivity
      summary: Consultar actividad
      description: Lectura permitida a RESPONSABLE de su propia actividad, DIRECTOR_INSTITUCIONAL en todas y DIRECTOR_CARRERA
        solo en actividades vinculadas en servidor a su carrera y sus paralelos. No confiar en carrera enviada por
        el cliente. Al vencer cinco años calendario desde su cierre definitivo, la consulta nominal devuelve 410;
        estadísticas anónimas no se exponen aquí. El 410 de conservación aplica mientras el recurso nominal vencido
        sea reconocible; después de sanear/eliminar sus encabezados, devolver 404 sin conservar PII para mantener
        un 410.
      tags:
      - activities
      responses:
        '200':
          description: Actividad autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/activityId'
  /activities/{activityId}/close:
    post:
      operationId: closeActivity
      summary: Cerrar definitivamente una actividad
      description: Solo RESPONSABLE vinculado a esta actividad. Los directores no reciben facultades de modificación
        por su permiso de lectura. Cierre definitivo distinto del cierre de una sesión. Cierra las sesiones activas,
        invalida QR e inicios invitados y fija cerrada_en y anonimizar_en a cinco años calendario. No permite reabrir
        ni crear nuevas sesiones.
      tags:
      - activities
      responses:
        '200':
          description: Actividad cerrada y plazo de conservación calculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/activityId'
      - $ref: '#/components/parameters/IdempotencyKey'
  /activities/{activityId}/guest-settings:
    put:
      operationId: setGuestSettings
      summary: Configurar acceso de invitados
      description: Solo RESPONSABLE vinculado a esta actividad. Los directores no reciben facultades de modificación
        por su permiso de lectura. Solo EVENTO abierto. Formulario exclusivo de personas sin cuenta precargadas.
        La tolerancia se copia al crear cada inicio; cambios posteriores no prolongan inicios ya emitidos. Deshabilitar
        impide nuevos envíos.
      tags:
      - activities
      responses:
        '200':
          description: Configuración validada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSettings'
              example:
                habilitado: true
                tolerancia_invitado_segundos: 120
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/activityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSettings'
  /activities/{activityId}/guest-list:
    put:
      operationId: replaceGuestList
      summary: Reemplazar listado de invitados
      description: Solo RESPONSABLE vinculado a esta actividad. Los directores no reciben facultades de modificación
        por su permiso de lectura. Solo EVENTO abierto. Reemplazo atómico; validar todo antes de guardar. Cada cédula
        identifica una persona sin crear cuenta. No autorregistro. Una cuenta existente, incluso inactiva, exige
        credenciales y no habilita la vía invitada. El límite inicial de 1000 entradas es técnico y fijo en este
        contrato; cambiarlo requiere actualizar el contrato y su versión. No es una regla institucional. Eliminar
        una entrada no elimina asistencias ya registradas.
      tags:
      - activities
      responses:
        '200':
          description: Listado reemplazado sin exponer su contenido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestListResult'
              example:
                activity_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                total: 2
                actualizada_en: '2026-10-19T15:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/activityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestListReplacement'
  /sessions/{sessionId}/start:
    post:
      operationId: startSession
      summary: Iniciar sesión de asistencia
      description: Solo RESPONSABLE vinculado a esta actividad. Los directores no reciben facultades de modificación
        por su permiso de lectura. Transición PROGRAMADA a ACTIVA solo si la actividad permanece abierta. Transacción
        coordinada con sus cierres.
      tags:
      - sessions
      responses:
        '200':
          description: Sesión activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/sessionId'
      - $ref: '#/components/parameters/IdempotencyKey'
  /sessions/{sessionId}/close:
    post:
      operationId: closeSession
      summary: Cerrar sesión de asistencia
      description: 'Solo RESPONSABLE vinculado a esta actividad. Los directores no reciben facultades de modificación
        por su permiso de lectura. Invalida inmediatamente nuevos registros e inicios de invitados, aunque QR o
        formularios tengan plazo restante. No inicia por sí mismo los cinco años: el origen es el cierre definitivo
        de la actividad.'
      tags:
      - sessions
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/sessionId'
      - $ref: '#/components/parameters/IdempotencyKey'
  /sessions/{sessionId}/qr:
    get:
      operationId: getSessionQr
      summary: Obtener QR vigente
      description: 'Solo RESPONSABLE vinculado a esta actividad. Los directores no reciben facultades de modificación
        por su permiso de lectura. Solo sesión ACTIVA y actividad abierta. Rotación cada 30 segundos; cada token
        vence a los 40 segundos desde su emisión. El servidor comprueba la hora de recepción, no la hora declarada
        por el dispositivo. No incluye datos personales. Responder Cache-Control: no-store. Representación permitida
        del cliente: URL con fragmento #qr=token; nunca ruta o query.'
      tags:
      - sessions
      responses:
        '200':
          description: QR actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Qr'
              example:
                qr_token: ejemplo-qr-opaco-no-es-un-secreto-real-0001
                emitido_en: '2026-10-19T16:00:00Z'
                vence_en: '2026-10-19T16:00:40Z'
                rotacion_segundos: 30
                vigencia_segundos: 40
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/sessionId'
  /sessions/{sessionId}/geolocation:
    put:
      operationId: setSessionGeolocation
      summary: Configurar GPS opcional
      description: 'Solo RESPONSABLE vinculado a esta actividad. Los directores no reciben facultades de modificación
        por su permiso de lectura. Solo PROGRAMADA. Habilitar exige capacidad geográfica disponible y radio_m, precision_max_m
        y antiguedad_max_s válidos. El servidor determina el modo: piloto/revisión permitido; rechazo automático
        solo con evidencia de campo verificada, sin aceptar una declaración del cliente como prueba. Sin GPS no
        se solicitan permisos ni se almacenan coordenadas. Capacidad ausente: 409 CAPACIDAD_GPS_NO_DISPONIBLE.'
      tags:
      - sessions
      responses:
        '200':
          description: Configuración y modo efectivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeolocationStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeolocationSettings'
  /attendance/attempts:
    post:
      operationId: recordAuthenticatedAttendance
      summary: Registrar asistencia autenticada
      description: Cuenta autenticada obligatoria. En CLASE comprobar vínculo autorizado a la clase; en EVENTO comprobar
        autorización del evento. No aceptar una cédula cliente para elegir identidad. Comprobar QR vigente, sesión
        activa, actividad abierta, GPS si corresponde y unicidad persona/sesión. El plazo exclusivo de invitados
        nunca aplica aquí. Con GPS deshabilitado, rechazar ubicación innecesaria sin guardarla.
      tags:
      - attendance
      responses:
        '201':
          description: Nueva asistencia confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceReceipt'
              example:
                asistencia_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                attempt_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                session_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                resultado: CONFIRMADA
                registrada_en: '2026-10-19T16:00:30Z'
                mensaje: Asistencia registrada.
        '200':
          description: Asistencia existente o repetición idempotente autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceReceipt'
              example:
                asistencia_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                attempt_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                session_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                resultado: CONFIRMADA
                registrada_en: '2026-10-19T16:00:30Z'
                mensaje: Asistencia registrada.
        '202':
          description: Repetir medición o esperar revisión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingReceipt'
              example:
                attempt_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                resultado: PENDIENTE_REVISION
                code: UBICACION_INCIERTA
                mensaje: El encargado revisará el intento.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/BusinessRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceAttemptRequest'
  /guest-registrations:
    post:
      operationId: startGuestRegistration
      summary: Abrir formulario exclusivo de invitados
      description: Sin cuenta autenticada; exige QR ordinario vigente, sesión ACTIVA, actividad EVENTO abierta y
        flujo invitado habilitado. Emite capacidad opaca asociada al formulario y a una sola persona al consumirse.
        inicio_en se fija al validar el QR en servidor; vence_en usa la tolerancia del evento tomada como instantánea.
        No extiende el QR ni la ventana de cuentas. No devuelve listado o datos personales. Rate limit obligatorio;
        no requiere Idempotency-Key. Recargar recupera el mismo inicio en sessionStorage de la pestaña sin volver
        a invocar esta operación ni extender vence_en. Un nuevo escaneo explícito de QR vigente puede abrir otro
        inicio, sin reiniciar el anterior.
      tags:
      - guest-registrations
      responses:
        '201':
          description: Inicio temporal creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestStartResult'
              example:
                registro_invitado_token: ejemplo-formulario-opaco-no-real-00000001
                inicio_en: '2026-10-19T16:00:20Z'
                vence_en: '2026-10-19T16:02:20Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestStartRequest'
  /guest-registrations/submit:
    post:
      operationId: submitGuestAttendance
      summary: Enviar cédula de invitado precargado
      description: 'Sin bearer de cuenta; autenticar capacidad registro_invitado_token. Validar vencimiento con
        recepción del servidor, sesión/actividad abiertas y flujo habilitado. Volver a consultar existencia de cuenta
        y pertenencia actual al listado dentro de la transacción; cuenta existente: 403 USAR_CREDENCIALES, fuera
        del listado: 403 NO_AUTORIZADO. Usar exclusivamente datos precargados. No OTP, verificación presencial ni
        autorregistro. Consumir capacidad para una sola persona y registrar una sola asistencia. GPS según sesión.
        Recibo mínimo sin nombres, cédula ni contenido del listado. Vencimiento: 410 FORMULARIO_EXPIRADO. Con GPS
        apagado rechazar ubicación innecesaria sin conservarla. El comportamiento de identificación por listado
        es una excepción constitucional propuesta, pendiente de revisión.'
      tags:
      - guest-registrations
      responses:
        '201':
          description: Nueva asistencia invitada confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceReceipt'
              example:
                asistencia_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                attempt_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                session_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                resultado: CONFIRMADA
                registrada_en: '2026-10-19T16:00:30Z'
                mensaje: Asistencia registrada.
        '200':
          description: Asistencia existente o replay autorizado por la misma capacidad y cédula.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceReceipt'
              example:
                asistencia_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                attempt_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                session_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                resultado: CONFIRMADA
                registrada_en: '2026-10-19T16:00:30Z'
                mensaje: Asistencia registrada.
        '202':
          description: Repetición o revisión necesaria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingReceipt'
              example:
                attempt_id: f12f0768-dc90-4f61-9ce9-9859fcd20d13
                resultado: REPETIR
                code: UBICACION_NO_DISPONIBLE
                mensaje: Vuelve a obtener tu ubicación.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/BusinessRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSubmitRequest'
  /sessions/{sessionId}/attendances:
    get:
      operationId: listAttendances
      summary: Consultar asistencias paginadas
      description: 'Lectura permitida a RESPONSABLE de su propia actividad, DIRECTOR_INSTITUCIONAL en todas y DIRECTOR_CARRERA
        solo en actividades vinculadas en servidor a su carrera y sus paralelos. No confiar en carrera enviada por
        el cliente. Al vencer retención de la actividad: 410 sin datos nominales; estadísticas agregadas se definirán
        por separado. Una fila por persona identificada: confirmación prevalece; sin asistencia, último intento
        identificado. Excluir intentos sin persona identificada y cédulas desconocidas. Aplicar estado después de
        esta proyección. El 410 de conservación aplica mientras el recurso nominal vencido sea reconocible; después
        de sanear/eliminar sus encabezados, devolver 404 sin conservar PII para mantener un 410.'
      tags:
      - sessions
      responses:
        '200':
          description: Página de asistencias permitidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendancePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/sessionId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/AttendanceState'
  /sessions/{sessionId}/attendances/export:
    get:
      operationId: exportAttendances
      summary: Exportar asistencias CSV
      description: 'Solo RESPONSABLE vinculado a esta actividad. Los directores no reciben facultades de modificación
        por su permiso de lectura. La lectura global o por carrera no concede exportación a los directores. Auditar
        la exportación. Al vencer retención: 410. No exportar secretos ni coordenadas exactas; neutralizar fórmulas
        en campos de texto. El 410 de conservación aplica mientras el recurso nominal vencido sea reconocible; después
        de sanear/eliminar sus encabezados, devolver 404 sin conservar PII para mantener un 410.'
      tags:
      - sessions
      responses:
        '200':
          description: 'CSV de asistencias del ámbito autorizado. Cache-Control: no-store.'
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="asistencias.csv"
          content:
            text/csv:
              schema:
                type: string
              example: 'asistencia_id,nombres,estado,registrada_en

                00000000-0000-4000-8000-000000000001,Persona ficticia,CONFIRMADA,2026-10-19T16:00:30Z

                '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/sessionId'
      - $ref: '#/components/parameters/AttendanceState'
  /attempts/{attemptId}/review:
    post:
      operationId: reviewAttempt
      summary: Resolver intento pendiente
      description: Solo RESPONSABLE vinculado a esta actividad. Los directores no reciben facultades de modificación
        por su permiso de lectura. Solo intento de su actividad pendiente de revisión. Razón no vacía, auditoría
        con responsable, fecha, anterior y nuevo. Aprobar para crear una asistencia requiere sesión ACTIVA y actividad
        abierta; si están cerradas devolver 409. Una aprobación no duplica asistencia. Rechazar una revisión no
        crea asistencia y puede resolver un pendiente después del cierre, mientras los datos sigan dentro de su
        conservación. Revisiones concurrentes y cierre comparten protocolo transaccional.
      tags:
      - attempts
      responses:
        '200':
          description: Revisión aplicada o repetida de forma idempotente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/BusinessRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/attemptId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
  /activities/{activityId}/audit:
    get:
      operationId: listActivityAudit
      summary: Consultar auditoría paginada
      description: 'Lectura permitida a RESPONSABLE de su propia actividad, DIRECTOR_INSTITUCIONAL en todas y DIRECTOR_CARRERA
        solo en actividades vinculadas en servidor a su carrera y sus paralelos. No confiar en carrera enviada por
        el cliente. Incluye acciones administrativas, cambios manuales, configuración, listados y exportaciones
        con sus valores pertinentes. No devuelve credenciales, tokens ni ubicación exacta. Auditoría nominal sujeta
        al mismo vencimiento: 410; evidencia estadística anónima fuera de este endpoint. El 410 de conservación
        aplica mientras el recurso nominal vencido sea reconocible; después de sanear/eliminar sus encabezados,
        devolver 404 sin conservar PII para mantener un 410.'
      tags:
      - activities
      responses:
        '200':
          description: Auditoría del ámbito permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/activityId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
components:
  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
      description: 'Sesión opaca aleatoria, revocable y respaldada por PostgreSQL. No JWT. Web: solo memoria; móvil:
        SecureStore. Revisar autenticación y ámbito también antes de un replay.'
  parameters:
    activityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    attemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'UUID por operación lógica. Misma identidad o capacidad invitada + operación + clave + carga
        canónica devuelve el resultado guardado tras revalidar autenticación y ámbito; carga distinta con la misma
        clave: 409. Nunca omite autorización ni crea una asistencia nueva después del cierre.'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AttendanceState:
      name: estado
      in: query
      schema:
        type: string
        enum:
        - CONFIRMADA
        - PENDIENTE_REVISION
        - RECHAZADA
  responses:
    BadRequest:
      description: Datos mal formados o parámetros inválidos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:unl:problem:solicitud-invalida
            title: Datos mal formados o parámetros inválidos.
            status: 400
            code: SOLICITUD_INVALIDA
            mensaje: Datos mal formados o parámetros inválidos.
    Unauthorized:
      description: Credenciales o bearer ausentes, inválidos, revocados o caducados.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:unl:problem:no-autenticado
            title: Credenciales o bearer ausentes, inválidos, revocados o caducados.
            status: 401
            code: NO_AUTENTICADO
            mensaje: Credenciales o bearer ausentes, inválidos, revocados o caducados.
    Forbidden:
      description: Permisos o ámbito insuficientes; en invitados USAR_CREDENCIALES si existe cuenta, NO_AUTORIZADO
        si no pertenece al listado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:unl:problem:no-autorizado
            title: Permisos o ámbito insuficientes
            status: 403
            code: NO_AUTORIZADO
            mensaje: Permisos o ámbito insuficientes; en invitados USAR_CREDENCIALES si existe cuenta, NO_AUTORIZADO
              si no pertenece al listado.
    NotFound:
      description: Recurso inexistente.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:unl:problem:recurso-no-encontrado
            title: Recurso inexistente.
            status: 404
            code: RECURSO_NO_ENCONTRADO
            mensaje: Recurso inexistente.
    Conflict:
      description: Estado incompatible o reutilización de Idempotency-Key con otra carga.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:unl:problem:estado-incompatible
            title: Estado incompatible o reutilización de Idempotency-Key con otra carga.
            status: 409
            code: ESTADO_INCOMPATIBLE
            mensaje: Estado incompatible o reutilización de Idempotency-Key con otra carga.
    Gone:
      description: Formulario vencido (FORMULARIO_EXPIRADO) o datos nominales ya sujetos a anonimización (DATOS_ANONIMIZADOS).
        En retención, 410 solo mientras el recurso vencido sea reconocible; tras sanear o eliminar el encabezado
        nominal, 404.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:unl:problem:formulario-expirado
            title: Formulario vencido (FORMULARIO_EXPIRADO) o datos nominales ya sujetos a anonimización (DATOS_ANONIMIZADOS).
            status: 410
            code: FORMULARIO_EXPIRADO
            mensaje: Formulario vencido (FORMULARIO_EXPIRADO) o datos nominales ya sujetos a anonimización (DATOS_ANONIMIZADOS).
    BusinessRejected:
      description: Intento rechazado por una regla de negocio; motivo legible y attempt_id cuando se registró el
        intento.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:unl:problem:qr-expirado
            title: Intento rechazado por una regla de negocio
            status: 422
            code: QR_EXPIRADO
            mensaje: Intento rechazado por una regla de negocio; motivo legible y attempt_id cuando se registró
              el intento.
    RateLimited:
      description: Demasiadas solicitudes; límite técnico configurable por despliegue.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:unl:problem:limite-solicitudes
            title: Demasiadas solicitudes
            status: 429
            code: LIMITE_SOLICITUDES
            mensaje: Demasiadas solicitudes; límite técnico configurable por despliegue.
      headers:
        Retry-After:
          description: Segundos antes de reintentar.
          schema:
            type: integer
            minimum: 1
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
          example: urn:unl:problem:session-closed
        title:
          type: string
          example: Sesión cerrada
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          example: La sesión ya no admite nuevos registros.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Código estable para el cliente; no contiene cédulas ni secretos. 002 añade DISPOSITIVO_REQUERIDO, DISPOSITIVO_YA_REGISTRADO, CEDULA_INVALIDA, ESPACIO_CODIGO_EXISTE, ESPACIO_SIN_UBICACION, METODO_NO_ADMITE_QR, QR_REQUERIDO, PARALELO_NO_ASIGNADO, SESION_NO_EDITABLE y HORARIO_DEMASIADO_LARGO.
          example: SESION_CERRADA
        mensaje:
          type: string
          example: La sesión está cerrada.
        attempt_id:
          type: string
          format: uuid
        correlation_id:
          type: string
      required:
      - type
      - title
      - status
      - code
      - mensaje
    VerificationMethod:
      type: string
      enum:
      - QR_Y_GPS
      - SOLO_QR
      - SOLO_GPS
      - NINGUNO
    DeviceId:
      type: string
      format: uuid
      description: Identificador de instalación generado por la app; el servidor solo guarda su HMAC.
    Space:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          maxLength: 40
        nombre:
          type: string
          maxLength: 200
        tipo:
          type: string
          enum:
          - AULA
          - LABORATORIO
          - AUDITORIO
          - EXTERIOR
          - OTRO
        latitud:
          type: number
          minimum: -90
          maximum: 90
        longitud:
          type: number
          minimum: -180
          maximum: 180
        radio_defecto_m:
          type: number
          minimum: 0
          exclusiveMinimum: true
        precision_defecto_m:
          type: number
          minimum: 0
          exclusiveMinimum: true
        editable:
          type: boolean
      required:
      - id
      - codigo
      - nombre
      - tipo
      - radio_defecto_m
      - precision_defecto_m
      - editable
    ImportReport:
      type: object
      additionalProperties: false
      properties:
        procesadas:
          type: integer
          minimum: 0
        creadas:
          type: integer
          minimum: 0
        actualizadas:
          type: integer
          minimum: 0
        sin_cambios:
          type: integer
          minimum: 0
        rechazadas:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              fila:
                type: integer
                minimum: 1
              motivo:
                type: string
            required:
            - fila
            - motivo
      required:
      - procesadas
      - creadas
      - actualizadas
      - sin_cambios
      - rechazadas
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        correo:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
      required:
      - correo
      - password
    LoginResult:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          minLength: 32
          maxLength: 512
          description: Secreto opaco aleatorio. No incluirlo en URL, logs o telemetría.
        token_type:
          type: string
          enum:
          - Bearer
        vence_en:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
            enum:
            - DOCENTE
            - ENCARGADO
            - ESTUDIANTE
            - DIRECTOR_INSTITUCIONAL
            - DIRECTOR_CARRERA
      required:
      - access_token
      - token_type
      - vence_en
      - roles
    Activity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        tipo:
          type: string
          enum:
          - CLASE
          - EVENTO
        estado:
          type: string
          enum:
          - ABIERTA
          - CERRADA
        cerrada_en:
          type: string
          format: date-time
          nullable: true
        anonimizar_en:
          type: string
          format: date-time
          nullable: true
        responsable_id:
          type: string
          format: uuid
        carrera_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        paralelo_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
      required:
      - id
      - nombre
      - tipo
      - estado
      - cerrada_en
      - anonimizar_en
      - responsable_id
      - carrera_ids
      - paralelo_ids
      description: Los eventos pueden vincular varias carreras y paralelos. El servidor calcula los ámbitos mediante
        estos vínculos y responsable_id; los filtros de lectura no los sustituyen.
    ActivityPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - total
    GuestSettings:
      type: object
      additionalProperties: false
      properties:
        habilitado:
          type: boolean
        tolerancia_invitado_segundos:
          type: integer
          minimum: 41
          description: Solo para el formulario de invitados sin cuenta precargados. No modifica la vigencia ordinaria
            del QR.
      required:
      - habilitado
      - tolerancia_invitado_segundos
    GuestEntry:
      type: object
      additionalProperties: false
      properties:
        cedula:
          type: string
          pattern: ^[0-9]{10}$
          description: Diez dígitos ASCII como cadena; conservar ceros iniciales. Identifica la entrada del listado,
            no acredita titularidad.
        nombres:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - cedula
      - nombres
    GuestListReplacement:
      type: object
      additionalProperties: false
      properties:
        invitados:
          type: array
          items:
            $ref: '#/components/schemas/GuestEntry'
          maxItems: 1000
          description: Límite técnico inicial fijo de 1000 entradas en este contrato; cambiarlo requiere actualizar
            el contrato y su versión. No es una regla institucional. Reemplazo completo y atómico; rechazar cédulas
            duplicadas y cualquier fila inválida.
      required:
      - invitados
    GuestListResult:
      type: object
      additionalProperties: false
      properties:
        activity_id:
          type: string
          format: uuid
        total:
          type: integer
          minimum: 0
        actualizada_en:
          type: string
          format: date-time
      required:
      - activity_id
      - total
      - actualizada_en
    Session:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        activity_id:
          type: string
          format: uuid
        estado:
          type: string
          enum:
          - PROGRAMADA
          - ACTIVA
          - CERRADA
        iniciada_en:
          type: string
          format: date-time
          nullable: true
        cerrada_en:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - activity_id
      - estado
      - iniciada_en
      - cerrada_en
    Qr:
      type: object
      additionalProperties: false
      properties:
        qr_token:
          type: string
          minLength: 32
          maxLength: 512
          description: 'Secreto QR opaco. Puede representarse en una URL con fragmento #qr=token, leído por el cliente
            y enviado solo en el cuerpo al backend. No incluirlo en ruta, query, logs o telemetría; retirar el fragmento
            tras leerlo.'
        emitido_en:
          type: string
          format: date-time
        vence_en:
          type: string
          format: date-time
        rotacion_segundos:
          type: integer
          enum:
          - 30
        vigencia_segundos:
          type: integer
          enum:
          - 40
      required:
      - qr_token
      - emitido_en
      - vence_en
      - rotacion_segundos
      - vigencia_segundos
    GeolocationSettings:
      type: object
      additionalProperties: false
      properties:
        habilitada:
          type: boolean
          default: false
        radio_m:
          type: number
          exclusiveMinimum: true
          minimum: 0
        precision_max_m:
          type: number
          exclusiveMinimum: true
          minimum: 0
        antiguedad_max_s:
          type: integer
          minimum: 1
      required:
      - habilitada
      description: Al habilitar se requieren los tres parámetros; el servidor los valida conjuntamente. Si está
        apagada no se pide permiso ni se conserva ubicación.
    GeolocationStatus:
      type: object
      additionalProperties: false
      properties:
        configuracion:
          $ref: '#/components/schemas/GeolocationSettings'
        capacidad_disponible:
          type: boolean
        modo_efectivo:
          type: string
          enum:
          - DESACTIVADA
          - PILOTO_REVISION
          - VALIDACION_AUTOMATICA
        evidencia_campo_verificada:
          type: boolean
      required:
      - configuracion
      - capacidad_disponible
      - modo_efectivo
      - evidencia_campo_verificada
    DeviceId:
      type: string
      format: uuid
      description: Identificador de instalación generado por la app; el servidor conserva solo su HMAC.
    Location:
      type: object
      additionalProperties: false
      properties:
        latitud:
          type: number
          minimum: -90
          maximum: 90
        longitud:
          type: number
          minimum: -180
          maximum: 180
        precision_m:
          type: number
          minimum: 0
        medido_en:
          type: string
          format: date-time
      required:
      - latitud
      - longitud
      - precision_m
      - medido_en
    AttendanceAttemptRequest:
      type: object
      additionalProperties: false
      properties:
        qr_token:
          type: string
          minLength: 32
          maxLength: 512
          description: 'Secreto QR opaco. Puede representarse en una URL con fragmento #qr=token, leído por el cliente
            y enviado solo en el cuerpo al backend. No incluirlo en ruta, query, logs o telemetría; retirar el fragmento
            tras leerlo.'
        dispositivo_id:
          $ref: '#/components/schemas/DeviceId'
        ubicacion:
          $ref: '#/components/schemas/Location'
      required:
      - qr_token
      - dispositivo_id
    AttendanceReceipt:
      type: object
      additionalProperties: false
      properties:
        asistencia_id:
          type: string
          format: uuid
        attempt_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        resultado:
          type: string
          enum:
          - CONFIRMADA
        registrada_en:
          type: string
          format: date-time
        mensaje:
          type: string
      required:
      - asistencia_id
      - attempt_id
      - session_id
      - resultado
      - registrada_en
      - mensaje
      description: Recibo mínimo compartido por ambos flujos. Sin cédula, nombres ni datos del listado.
    PendingReceipt:
      type: object
      additionalProperties: false
      properties:
        attempt_id:
          type: string
          format: uuid
        resultado:
          type: string
          enum:
          - REPETIR
          - PENDIENTE_REVISION
        code:
          type: string
        mensaje:
