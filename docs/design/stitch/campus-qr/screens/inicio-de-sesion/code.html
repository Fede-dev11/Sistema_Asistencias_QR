<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

ainer": "#90a8ff", "on-tertiary-fixed": "#001a42" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xl": "2rem", "margin": "1.25rem", "gutter": "1rem", "space-lg": "1.5rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "space-md": "1rem" }, fontFamily: { "headline-sm": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "headline-md": ["Inter"], "label-lg": ["Inter"], "body-lg": ["Inter"], "headline-xl": ["Inter"], "title-md": ["Inter"], "body-md": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"] }, fontSize: { "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "500" }] } } } };</script></head><body class="bg-surface text-on-surface pt-safe pb-safe min-h-screen flex flex-col"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Subtle decorative ambient elements -->
<div class="relative w-full flex flex-col items-center pt-space-md pb-space-sm text-center"><div class="relative flex items-center justify-center w-28 h-28 mb-3 bg-surface-container-lowest rounded-2xl shadow-sm p-2"><img alt="Universidad Nacional de Loja" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDYuq0_alGDKXjjLLqhaUFLss67eGQtkAWI5kR2Zvn08joxEQGp8clPq8BaM2k41-dRCr7pNRiqS935Kz-_DEzAUbjSprMiE1tLFUYjB3R-op6Wo6kTP6ynQS6IHAp0Atr68rq8Zy_pfI9F9j9zBXKt0BiENhzfzmLOndzvUi7IXLNn_FuyHcAzKpQQLlVDQ3bcQIfuJguY_dWcCHA7oRE7hJ2gBbs9NEzbaSAIYW-Lb0pak73xiz0"><div class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-secondary rounded-full border-2 border-surface-container-lowest shadow-sm"></div></div><div class="inline-flex items-center gap-1.5 px-3 py-1 bg-surface-container-high rounded-full mb-2"><span class="w-1.5 h-1.5 rounded-full bg-secondary"></span><span class="font-label-sm text-label-sm text-primary font-semibold tracking-wide">UNIVERSIDAD NACIONAL DE LOJA</span></div><h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight font-bold">UniCheck</h1><p class="font-label-md text-label-md text-primary font-semibold">Portal Estudiantil</p><p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs mt-1">Registro digital y validación de asistencia académica en tiempo real</p></div>
<!-- Role Selector (Segmented Control) -->

<!-- Main Login Card -->
<div class="bg-surface-container-lowest rounded-2xl p-space-lg shadow-sm">
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault(); triggerLogin();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="institutional-email"><span class="">Correo Institucional</span><span class="font-label-sm text-label-sm text-primary bg-surface-container px-2 py-0.5 rounded-md font-medium" id="role-badge">@unl.edu.ec</span></label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-xl pointer-events-none">alternate_email</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md pl-11 pr-4 py-3 rounded-xl focus:outline-none focus:bg-surface-container-lowest shadow-sm placeholder:text-outline transition-colors" id="institutional-email" placeholder="usuario@unl.edu.ec" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password-input">Contraseña</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-xl pointer-events-none">lock</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md pl-11 pr-11 py-3 rounded-xl focus:outline-none focus:bg-surface-container-lowest shadow-sm placeholder:text-outline transition-colors" id="password-input" placeholder="••••••••••••" required="" type="password">
<button aria-label="Mostrar contraseña" class="absolute right-3 p-1 text-on-surface-variant hover:text-on-surface focus:outline-none flex items-center justify-center rounded-lg" id="toggle-password-btn" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-xl" id="toggle-password-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Session Checkbox -->
<div class="flex items-center justify-between pt-0.5">
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary focus:ring-0 accent-primary cursor-pointer" id="remember-session" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant">Recordar mi sesión</span>
</label>
<div class="flex items-center gap-1 text-secondary font-label-sm text-label-sm bg-secondary-container/30 px-2 py-0.5 rounded-full">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span class="">Red Segura</span>
</div>
</div>
<!-- Main Login Button -->
<button class="w-full mt-2 py-3.5 px-4 bg-primary-container text-on-primary font-title-md text-title-md rounded-2xl shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="submit-button" type="submit">
<span class="">Iniciar Sesión</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Biometric Access Trigger -->

</div>
<!-- Campus Status Hint Card -->

<!-- Campus Support Footer -->
<footer class="mt-space-xl flex flex-col items-center justify-center gap-2 text-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-base text-outline">headset_mic</span>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">
        Mesa de Ayuda &amp; Soporte Estudiantil
      </a>
</div>
<p class="font-label-sm text-label-sm text-outline">
      Tecnología de Asistencia Académica • v2.4.0
    </p>
</footer>
</div>
<script>
  let currentRole = 'estudiante';

  function selectRole(role) {
    currentRole = role;
    const studentBtn = document.getElementById('btn-role-estudiante');
    const teacherBtn = document.getElementById('btn-role-docente');
    const emailInput = document.getElementById('institutional-email');
    const roleBadge = document.getElementById('role-badge');

    if (role === 'estudiante') {
      studentBtn.className = 'flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-primary-container text-on-primary shadow-sm transition-all duration-200';
      teacherBtn.className = 'flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-transparent text-on-surface-variant transition-all duration-200 hover:text-on-surface';
      emailInput.placeholder = 'estudiante@universidad.edu';
      roleBadge.textContent = 'ID Alumno';
    } else {
      teacherBtn.className = 'flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-primary-container text-on-primary shadow-sm transition-all duration-200';
      studentBtn.className = 'flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-transparent text-on-surface-variant transition-all duration-200 hover:text-on-surface';
      emailInput.placeholder = 'docente@universidad.edu';
      roleBadge.textContent = 'Cédula Docente';
    }
  }

  function togglePassword() {
    const passwordInput = document.getElementById('password-input');
    const icon = document.getElementById('toggle-password-icon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function simulateBiometrics() {
    const btn = event.currentTarget;
    btn.classList.add('opacity-75');
    setTimeout(() => {
      btn.classList.remove('opacity-75');
      alert('Autenticación biométrica exitosa. Redirigiendo a UniCheck...');
    }, 600);
  }

  function triggerLogin() {
    const btn = document.getElementById('submit-button');
    const originalContent = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg">sync</span> Validando...';
    btn.disabled = true;

    setTimeout(() => {
      btn.innerHTML = originalContent;
      btn.disabled = false;
      alert('Sesión iniciada correctamente como ' + (currentRole === 'estudiante' ? 'Estudiante' : 'Docente'));
    }, 1000);
  }
</script></main>

</body></html>
