name: geoasist
services:
  db:
    image: postgres:17.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geoasist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-geoasist}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - geoasist-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    profiles: [api]
    build: ../services/api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-geoasist}
      POSTGRES_USER: ${POSTGRES_USER:-geoasist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      GEOASIST_HMAC_KEY: ${GEOASIST_HMAC_KEY:?Define GEOASIST_HMAC_KEY}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:?Define DEV_SEED_PASSWORD}
      SPRING_PROFILES_ACTIVE: dev
      SSO_INTERNAL_URL: http://auth:8081
      SSO_PUBLIC_URL: ${SSO_PUBLIC_URL:-http://localhost:8081}
      SSO_SERVICE_KEY: ${SSO_SERVICE_KEY:?Define SSO_SERVICE_KEY}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
  auth:
    profiles: [api]
    build: ../services/auth
    environment:
      AUTH_DATABASE_URL: jdbc:postgresql://db:5432/geoasist_auth
      POSTGRES_USER: ${POSTGRES_USER:-geoasist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:?Define DEV_SEED_PASSWORD}
      SSO_SERVICE_KEY: ${SSO_SERVICE_KEY:?Define SSO_SERVICE_KEY}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "127.0.0.1:${AUTH_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
volumes:
  geoasist-data:
