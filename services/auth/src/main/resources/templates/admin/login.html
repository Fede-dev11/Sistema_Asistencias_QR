<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragmentos :: cabecera('Ingresar')}"></head>
<body>
<main>
  <h1>Administración</h1>
  <p class="hint">Ingresa con una cuenta de administrador del servicio (datos ficticios).</p>
  <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
  <form method="post" th:action="@{/admin/login}">
    <label for="correo">Correo</label>
    <input id="correo" name="correo" type="email" autocomplete="username" required autofocus maxlength="254">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
    <button type="submit">Ingresar</button>
  </form>
</main>
</body>
</html>
