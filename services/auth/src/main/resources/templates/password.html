<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar contraseña - Cuenta universitaria</title>
  <link rel="stylesheet" th:href="@{/css/sso.css}">
</head>
<body>
<main>
  <h1>Cambiar contraseña</h1>
  <p class="hint" th:if="${obligatorio}">Debes cambiar tu contraseña antes de continuar.</p>
  <p class="hint">Usa entre 12 y 128 caracteres.</p>
  <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
  <form method="post" th:action="@{/cas/password}">
    <input type="hidden" name="service" th:value="${service}">
    <label for="actual">Contraseña actual</label>
    <input id="actual" name="actual" type="password" autocomplete="current-password" required autofocus maxlength="128">
    <label for="nueva">Nueva contraseña</label>
    <input id="nueva" name="nueva" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
    <label for="confirmar">Confirmar nueva contraseña</label>
    <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
    <button type="submit">Cambiar contraseña</button>
  </form>
</main>
</body>
</html>
